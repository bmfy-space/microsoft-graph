<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Microsoft Graph Mail</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; color: #1a1a1a; background: #f5f5f5; }

  /* Layout */
  .app { display: flex; height: 100vh; }
  .panel { display: flex; flex-direction: column; border-right: 1px solid #e0e0e0; background: #fff; overflow: hidden; }
  .panel:last-child { border-right: none; }
  .panel-header { height: 44px; padding: 0 16px; border-bottom: 1px solid #e0e0e0; font-weight: 600; font-size: 13px; color: #666; background: #fafafa; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; }
  .panel-body { flex: 1; overflow-y: auto; min-height: 0; }

  .panel-accounts { width: 300px; min-width: 300px; }
  .panel-emails { width: 360px; min-width: 320px; }
  .panel-content { flex: 1; min-width: 0; }

  /* Buttons */
  .btn { padding: 6px 14px; border: none; border-radius: 5px; font-size: 12px; cursor: pointer; font-weight: 500; transition: background .15s; }
  .btn-primary { background: #4a90d9; color: #fff; }
  .btn-primary:hover { background: #3a7bc8; }
  .btn-ghost { background: transparent; color: #666; border: 1px solid #d0d0d0; }
  .btn-ghost:hover { background: #f0f0f0; }
  .btn-sm { padding: 4px 10px; font-size: 11px; }
  .btn-icon { width: 28px; height: 28px; padding: 0; border: 1px solid #d0d0d0; border-radius: 5px; background: #fff; cursor: pointer; font-size: 16px; color: #666; display: flex; align-items: center; justify-content: center; transition: background .15s; }
  .btn-icon:hover { background: #f0f0f0; }

  /* Account list */
  .account-item { padding: 10px 40px 10px 16px; cursor: pointer; border-bottom: 1px solid #f0f0f0; transition: background .1s; position: relative; }
  .account-item:hover { background: #f8f9fa; }
  .account-item.active { background: #e8f0fe; border-left: 3px solid #4a90d9; padding-left: 13px; }
  .account-item .email { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .account-item .status { font-size: 11px; color: #999; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .account-item .status.ok { color: #34a853; }
  .account-item .status.err { color: #ea4335; }
  .account-item .status.valid { color: #34a853; }
  .account-item .status.invalid { color: #ea4335; }
  .account-item .status.checking { color: #f9a825; }
  .account-item .actions { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); opacity: 0; }
  .account-item:hover .actions { opacity: 1; }
  .account-item .actions-trigger { background: none; border: 1px solid transparent; cursor: pointer; padding: 2px 6px; border-radius: 4px; color: #aaa; font-size: 14px; line-height: 1; }
  .account-item:hover .actions-trigger { border-color: #ddd; color: #888; }
  .account-item .actions-trigger:hover { background: #eee; }

  /* Global floating menu */
  .float-menu { position: fixed; background: #fff; border: 1px solid #e0e0e0; border-radius: 6px; box-shadow: 0 4px 12px rgba(0,0,0,.15); z-index: 9999; min-width: 120px; overflow: hidden; }
  .float-menu.hidden { display: none; }
  .float-menu div { padding: 8px 14px; font-size: 12px; cursor: pointer; }
  .float-menu div:hover { background: #f0f4fa; }
  .float-menu .danger { color: #ea4335; }
  .account-count { font-size: 11px; color: #999; font-weight: 400; }

  /* Email list */
  .email-item { padding: 10px 16px; cursor: pointer; border-bottom: 1px solid #f0f0f0; transition: background .1s; }
  .email-item:hover { background: #f8f9fa; }
  .email-item.active { background: #e8f0fe; }
  .email-item .subject { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .email-item .meta { display: flex; justify-content: space-between; margin-top: 3px; font-size: 12px; color: #888; }
  .email-item .sender { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; margin-right: 8px; }
  .email-item .date { white-space: nowrap; }
  .email-item .preview { font-size: 12px; color: #999; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Email content */
  .content-header { padding: 16px 20px; border-bottom: 1px solid #e0e0e0; flex-shrink: 0; }
  .content-header .subject { font-size: 16px; font-weight: 600; line-height: 1.4; }
  .content-header .from { font-size: 13px; color: #555; margin-top: 8px; }
  .content-header .from strong { color: #1a1a1a; }
  .content-header .recipients { font-size: 12px; color: #888; margin-top: 4px; }
  .content-header .date { font-size: 12px; color: #888; margin-top: 2px; }
  .content-body { flex: 1; min-height: 0; overflow: hidden; position: relative; }
  .content-body iframe { width: 100%; height: 100%; border: none; display: block; }
  .content-body .text-content { padding: 20px; white-space: pre-wrap; word-break: break-word; line-height: 1.6; overflow-y: auto; height: 100%; }

  /* Email content wrapper */
  .content-wrap { display: flex; flex-direction: column; height: 100%; overflow: hidden; }

  /* Empty / loading states */
  .empty { display: flex; align-items: center; justify-content: center; height: 100%; color: #bbb; font-size: 13px; }
  .loading { display: flex; align-items: center; justify-content: center; padding: 20px; }
  .spinner { width: 20px; height: 20px; border: 2px solid #e0e0e0; border-top-color: #4a90d9; border-radius: 50%; animation: spin .6s linear infinite; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Modal overlay */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 1000; display: flex; align-items: center; justify-content: center; }
  .modal-overlay.hidden { display: none; }
  .modal { background: #fff; border-radius: 10px; width: 480px; max-width: 90vw; box-shadow: 0 8px 30px rgba(0,0,0,.15); }
  .modal-header { padding: 16px 20px; border-bottom: 1px solid #e0e0e0; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: space-between; }
  .modal-header .close-btn { background: none; border: none; font-size: 20px; color: #999; cursor: pointer; line-height: 1; }
  .modal-header .close-btn:hover { color: #333; }
  .modal-body { padding: 20px; }
  .modal-body textarea { width: 100%; height: 160px; border: 1px solid #d0d0d0; border-radius: 6px; padding: 10px 12px; font-size: 12px; font-family: "SF Mono", Consolas, monospace; resize: vertical; outline: none; transition: border-color .15s; }
  .modal-body textarea:focus { border-color: #4a90d9; }
  .modal-body textarea::placeholder { color: #aaa; }
  .modal-body .hint { font-size: 12px; color: #999; margin-top: 8px; }
  .modal-footer { padding: 12px 20px; border-top: 1px solid #e0e0e0; display: flex; justify-content: flex-end; gap: 8px; }

  /* Export dropdown */
  .export-menu { position: absolute; right: 0; top: 32px; background: #fff; border: 1px solid #e0e0e0; border-radius: 6px; box-shadow: 0 4px 12px rgba(0,0,0,.1); z-index: 100; min-width: 160px; overflow: hidden; }
  .export-menu.hidden { display: none; }
  .export-menu-item { padding: 9px 14px; font-size: 12px; cursor: pointer; transition: background .1s; }
  .export-menu-item:hover { background: #f0f4fa; }
</style>
</head>
<body>
<div class="app">

  <!-- Left: Accounts -->
  <div class="panel panel-accounts">
    <div class="panel-header">
      <span>Accounts <span class="account-count" id="accountCount"></span></span>
      <div style="display:flex;gap:4px;position:relative">
        <button class="btn btn-sm btn-ghost" onclick="openImportModal()">Import</button>
        <button class="btn btn-sm btn-ghost" onclick="toggleActionsMenu(event)" id="actionsBtn">Actions</button>
        <div class="export-menu hidden" id="actionsMenu">
          <div class="export-menu-item" onclick="checkAllAccounts()">Check all</div>
          <div class="export-menu-item hidden" id="clearInvalidItem" onclick="removeInvalidAccounts()">Clear invalid</div>
          <div class="export-menu-item" onclick="exportCopy()">Copy all</div>
          <div class="export-menu-item" onclick="exportDownload()">Download .txt</div>
        </div>
      </div>
    </div>
    <div class="panel-body" id="accountList">
      <div class="empty">No accounts</div>
    </div>
  </div>

  <!-- Middle: Emails -->
  <div class="panel panel-emails">
    <div class="panel-header">
      <span id="emailsTitle">Emails</span>
      <button class="btn btn-sm btn-ghost" onclick="refreshEmails()" id="refreshBtn" style="display:none">Refresh</button>
    </div>
    <div class="panel-body" id="emailList">
      <div class="empty">Select an account</div>
    </div>
  </div>

  <!-- Right: Content -->
  <div class="panel panel-content">
    <div class="panel-header">Content</div>
    <div class="panel-body" id="emailContent">
      <div class="empty">Select an email</div>
    </div>
  </div>

</div>

<!-- Floating item menu -->
<div class="float-menu hidden" id="floatMenu">
  <div id="floatMenuCopy">Copy</div>
  <div class="danger" id="floatMenuRemove">Remove</div>
</div>

<!-- Import Modal -->
<div class="modal-overlay hidden" id="importModal">
  <div class="modal">
    <div class="modal-header">
      <span>Import Accounts</span>
      <button class="close-btn" onclick="closeImportModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
        <label style="font-size:12px;color:#666;white-space:nowrap">Separator</label>
        <input id="separatorInput" value="----" style="flex:1;border:1px solid #d0d0d0;border-radius:6px;padding:6px 10px;font-size:12px;font-family:'SF Mono',Consolas,monospace;outline:none;transition:border-color .15s" onfocus="this.style.borderColor='#4a90d9'" onblur="this.style.borderColor='#d0d0d0'">
      </div>
      <textarea id="importInput" placeholder="每行一条凭证，默认用 ---- 分隔：&#10;email----password----clientId----refreshToken"></textarea>
      <div class="hint">Supports multiple lines, duplicates are automatically skipped.</div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeImportModal()">Cancel</button>
      <button class="btn btn-primary" onclick="importAccounts()">Import</button>
    </div>
  </div>
</div>

<script>
const API_BASE = window.location.origin;
let accounts = [];
let activeAccountId = null;
let activeEmailId = null;
let accountSeq = 0;

// ── IndexedDB ──

const DB_NAME = 'GraphMail';
const DB_VERSION = 2;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      let accStore;
      if (!db.objectStoreNames.contains('accounts')) {
        accStore = db.createObjectStore('accounts', { keyPath: 'id' });
      } else {
        accStore = req.transaction.objectStore('accounts');
      }
      if (!accStore.indexNames.contains('by_seq')) {
        accStore.createIndex('by_seq', 'seq', { unique: false });
      }
      if (!db.objectStoreNames.contains('emails')) {
        db.createObjectStore('emails', { keyPath: 'accountId' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbGetAllBySeq() {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction('accounts', 'readonly');
    const idx = tx.objectStore('accounts').index('by_seq');
    const req = idx.getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  }));
}

function dbPut(store, value) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(value);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  }));
}

function dbDelete(store, key) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  }));
}

function dbGetAll(store) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  }));
}

function dbGet(store, key) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  }));
}

// ── Modal ──

function openImportModal() {
  document.getElementById('importModal').classList.remove('hidden');
  document.getElementById('importInput').focus();
}

function closeImportModal() {
  document.getElementById('importModal').classList.add('hidden');
  document.getElementById('importInput').value = '';
}

document.getElementById('importModal').addEventListener('click', function(e) {
  if (e.target === this) closeImportModal();
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') { closeImportModal(); closeActionsMenu(); document.querySelectorAll('.item-menu.show').forEach(m => m.classList.remove('show')); }
});

document.addEventListener('click', function(e) {
  if (!e.target.closest('#actionsMenu') && !e.target.closest('#actionsBtn')) closeActionsMenu();
  if (!e.target.closest('.float-menu') && !e.target.closest('.actions-trigger')) closeFloatMenu();
});

// ── Actions Menu ──

function getExportText() {
  return accounts.map(a => a.raw).join('\n');
}

function toggleActionsMenu(e) {
  e.stopPropagation();
  document.getElementById('actionsMenu').classList.toggle('hidden');
}

function closeActionsMenu() {
  document.getElementById('actionsMenu').classList.add('hidden');
}

async function exportCopy() {
  closeActionsMenu();
  if (!accounts.length) return;
  try {
    await navigator.clipboard.writeText(getExportText());
  } catch {
    const ta = document.createElement('textarea');
    ta.value = getExportText();
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
}

function exportDownload() {
  closeActionsMenu();
  if (!accounts.length) return;
  const blob = new Blob([getExportText()], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'accounts.txt';
  a.click();
  URL.revokeObjectURL(a.href);
}

// ── Accounts ──

let floatMenuTarget = null;

function openFloatMenu(id, btn) {
  const menu = document.getElementById('floatMenu');
  const rect = btn.getBoundingClientRect();
  menu.style.left = rect.right - 120 + 'px';
  menu.style.top = rect.bottom + 4 + 'px';
  menu.classList.remove('hidden');
  floatMenuTarget = id;
  document.getElementById('floatMenuCopy').onclick = function(e) { e.stopPropagation(); copyAccount(floatMenuTarget, e); closeFloatMenu(); };
  document.getElementById('floatMenuRemove').onclick = function(e) { e.stopPropagation(); removeAccount(floatMenuTarget, e); closeFloatMenu(); };
}

function closeFloatMenu() {
  document.getElementById('floatMenu').classList.add('hidden');
  floatMenuTarget = null;
}

function toggleItemMenu(id, e) {
  e.stopPropagation();
  const menu = document.getElementById('floatMenu');
  if (!menu.classList.contains('hidden') && floatMenuTarget === id) { closeFloatMenu(); return; }
  openFloatMenu(id, e.currentTarget);
}

function showItemMenu(id, btn) {
  if (floatMenuTarget === id) return;
  openFloatMenu(id, btn);
}

function hideItemMenu(id) {
  closeFloatMenu();
}

async function importAccounts() {
  const raw = document.getElementById('importInput').value.trim();
  const separator = document.getElementById('separatorInput').value || '----';
  if (!raw) return;
  const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
  let added = 0;
  for (const line of lines) {
    if (accounts.some(a => a.raw === line)) continue;
    const parts = line.split(separator);
    const email = parts[0] || line.slice(0, 30);
    const acc = { id: crypto.randomUUID(), email, raw: line, separator, seq: ++accountSeq, status: null, emailCount: null };
    accounts.push(acc);
    await dbPut('accounts', acc);
    added++;
  }
  closeImportModal();
  renderAccounts();
  if (added > 0 && !activeAccountId) selectAccount(accounts[0].id);
}

async function removeAccount(id, e) {
  e.stopPropagation();
  accounts = accounts.filter(a => a.id !== id);
  await dbDelete('accounts', id);
  await dbDelete('emails', id);
  if (activeAccountId === id) {
    activeAccountId = null;
    activeEmailId = null;
    document.getElementById('emailList').innerHTML = '<div class="empty">Select an account</div>';
    document.getElementById('emailContent').innerHTML = '<div class="empty">Select an email</div>';
    document.getElementById('emailsTitle').textContent = 'Emails';
    document.getElementById('refreshBtn').style.display = 'none';
  }
  renderAccounts();
}

async function removeInvalidAccounts() {
  closeActionsMenu();
  const invalid = accounts.filter(a => a.checkStatus === 'invalid');
  if (!invalid.length) return;
  for (const a of invalid) {
    await dbDelete('accounts', a.id);
    await dbDelete('emails', a.id);
  }
  accounts = accounts.filter(a => a.checkStatus !== 'invalid');
  if (activeAccountId && !accounts.some(a => a.id === activeAccountId)) {
    activeAccountId = null;
    activeEmailId = null;
    document.getElementById('emailList').innerHTML = '<div class="empty">Select an account</div>';
    document.getElementById('emailContent').innerHTML = '<div class="empty">Select an email</div>';
    document.getElementById('emailsTitle').textContent = 'Emails';
    document.getElementById('refreshBtn').style.display = 'none';
  }
  renderAccounts();
}

async function copyAccount(id, e) {
  e.stopPropagation();
  const acc = accounts.find(a => a.id === id);
  if (!acc) return;
  try {
    await navigator.clipboard.writeText(acc.raw);
  } catch {
    const ta = document.createElement('textarea');
    ta.value = acc.raw;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
}

async function checkAllAccounts() {
  closeActionsMenu();
  if (!accounts.length) return;
  const btn = document.getElementById('actionsBtn');
  btn.disabled = true;
  btn.textContent = '...';

  // Set all to checking
  accounts.forEach(a => { a.checkStatus = 'checking'; });
  renderAccounts();

  try {
    const resp = await fetch(`${API_BASE}/api/check`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        credentials: accounts.map(a => a.raw),
        separator: accounts[0]?.separator || '----',
      }),
    });
    const data = await resp.json();
    if (data.code === 200 && data.data) {
      for (const r of data.data) {
        const acc = accounts.find(a => a.email === r.email);
        if (acc) {
          acc.checkStatus = r.valid ? 'valid' : 'invalid';
          acc.checkError = r.error || '';
          await dbPut('accounts', acc);
        }
      }
    }
  } catch {
    accounts.forEach(a => { a.checkStatus = ''; });
  }

  renderAccounts();
  btn.disabled = false;
  btn.textContent = 'Actions';
}

function renderAccounts() {
  const el = document.getElementById('accountList');
  document.getElementById('accountCount').textContent = accounts.length ? `(${accounts.length})` : '';
  const hasInvalid = accounts.some(a => a.checkStatus === 'invalid');
  document.getElementById('clearInvalidItem').classList.toggle('hidden', !hasInvalid);
  if (!accounts.length) { el.innerHTML = '<div class="empty">No accounts</div>'; return; }
  el.innerHTML = accounts.map(a => {
    const statusClass = a.checkStatus === 'valid' ? 'valid' : a.checkStatus === 'invalid' ? 'invalid' : a.checkStatus === 'checking' ? 'checking' : '';
    const statusText = a.checkStatus === 'valid' ? '✓ Valid' :
                       a.checkStatus === 'invalid' ? `✗ ${a.checkError || 'Invalid'}` :
                       a.checkStatus === 'checking' ? 'Checking...' :
                       a.status === 'ok' ? `✓ ${a.emailCount ?? 0} emails` :
                       a.status === 'err' ? '✗ Failed' :
                       a.status === 'loading' ? 'Loading...' : '—';
    return `
    <div class="account-item ${a.id === activeAccountId ? 'active' : ''}" onclick="selectAccount('${a.id}')">
      <div class="email" title="${a.email}">${a.email}</div>
      <div class="status ${statusClass}">${statusText}</div>
      <div class="actions">
        <button class="actions-trigger" data-acc="${a.id}" onclick="toggleItemMenu('${a.id}', event)" onmouseenter="showItemMenu('${a.id}', this)" title="Actions">···</button>
      </div>
    </div>`;
  }).join('');
}

// ── Emails ──

async function selectAccount(id) {
  activeAccountId = id;
  activeEmailId = null;
  const acc = accounts.find(a => a.id === id);
  renderAccounts();
  document.getElementById('emailContent').innerHTML = '<div class="empty">Select an email</div>';
  document.getElementById('refreshBtn').style.display = 'inline-block';

  // Try cached emails first
  const cached = await dbGet('emails', id);
  if (cached?.emails?.length) {
    acc.emails = cached.emails;
    acc.status = 'ok';
    acc.emailCount = cached.emails.length;
    renderAccounts();
    document.getElementById('emailsTitle').textContent = `Emails (${cached.emails.length})`;
    renderEmails(acc.emails);
  } else {
    await loadEmails(acc);
  }
}

async function refreshEmails() {
  const acc = accounts.find(a => a.id === activeAccountId);
  if (acc) await loadEmails(acc);
}

async function loadEmails(acc) {
  const list = document.getElementById('emailList');
  document.getElementById('emailsTitle').textContent = 'Loading...';
  list.innerHTML = '<div class="loading"><div class="spinner"></div>Loading</div>';

  try {
    const resp = await fetch(`${API_BASE}/api/email`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ credentials: acc.raw, separator: acc.separator || '----', page: 1, pageSize: 50 }),
    });
    const data = await resp.json();
    if (data.code !== 200) throw new Error(data.msg);

    acc.emails = data.data.emails;
    acc.status = 'ok';
    acc.emailCount = data.data.total;
    await dbPut('accounts', acc);
    await dbPut('emails', { accountId: acc.id, emails: acc.emails });
    renderAccounts();
    document.getElementById('emailsTitle').textContent = `Emails (${data.data.total})`;
    renderEmails(acc.emails);
  } catch (e) {
    acc.status = 'err';
    acc.emails = [];
    await dbPut('accounts', acc);
    renderAccounts();
    document.getElementById('emailsTitle').textContent = 'Emails';
    list.innerHTML = `<div class="empty">${e.message}</div>`;
  }
}

function renderEmails(emails) {
  const el = document.getElementById('emailList');
  if (!emails.length) { el.innerHTML = '<div class="empty">No emails</div>'; return; }
  el.innerHTML = emails.map(e => {
    const d = e.date ? formatDate(e.date) : '?';
    const sender = e.from?.name || e.from?.address || 'Unknown';
    return `
      <div class="email-item ${e.id === activeEmailId ? 'active' : ''}" onclick="selectEmail('${e.id}')">
        <div class="subject">${esc(e.subject)}</div>
        <div class="meta"><span class="sender">${esc(sender)}</span><span class="date">${d}</span></div>
        <div class="preview">${esc(e.preview)}</div>
      </div>`;
  }).join('');
}

// ── Content ──

function selectEmail(id) {
  activeEmailId = id;
  const acc = accounts.find(a => a.id === activeAccountId);
  if (!acc?.emails) return;
  const email = acc.emails.find(e => e.id === id);
  if (!email) return;
  renderEmails(acc.emails);
  renderContent(email);
}

function renderContent(email) {
  const el = document.getElementById('emailContent');
  const d = email.date ? formatDate(email.date) : '?';
  const from = email.from;
  const fromStr = from.name ? `${from.name} <${from.address}>` : from.address;
  const toStr = (email.to || []).join(', ');
  const ccStr = (email.cc || []).join(', ');

  let bodyHtml;
  if (email.body.contentType === 'html') {
    bodyHtml = `<iframe sandbox="allow-same-origin" srcdoc="${escAttr(email.body.content)}"></iframe>`;
  } else {
    bodyHtml = `<div class="text-content">${esc(email.body.content)}</div>`;
  }

  el.innerHTML = `
    <div class="content-wrap">
      <div class="content-header">
        <div class="subject">${esc(email.subject)}</div>
        <div class="from"><strong>${esc(fromStr)}</strong></div>
        ${toStr ? `<div class="recipients">To: ${esc(toStr)}</div>` : ''}
        ${ccStr ? `<div class="recipients">Cc: ${esc(ccStr)}</div>` : ''}
        <div class="date">${d}</div>
      </div>
      <div class="content-body">${bodyHtml}</div>
    </div>`;
}

// ── Util ──

function formatDate(raw) {
  const d = new Date(raw);
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  const hh = String(d.getHours()).padStart(2, '0');
  const mi = String(d.getMinutes()).padStart(2, '0');
  return `${mm}-${dd} ${hh}:${mi}`;
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function escAttr(s) {
  return (s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ── Init: load from IndexedDB ──

(async function init() {
  try {
    accounts = await dbGetAllBySeq();
    accountSeq = accounts.length ? Math.max(...accounts.map(a => a.seq || 0)) : 0;
    renderAccounts();
  } catch (e) {
    console.error('Failed to load from IndexedDB:', e);
  }
})();
</script>
